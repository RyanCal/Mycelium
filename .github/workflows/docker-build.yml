name: docker-build

# Mycelium is on hold. Keep the release workflow visible but inert until an exact task re-enables
# publication with deployment verification and rollback.
on:
  workflow_dispatch:

jobs:
  docker:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ryancal/mycelium-kernel:${{ github.ref_name }}
